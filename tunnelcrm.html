<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TunnelCRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a1a;font-size:14px}
:root{--bg:#fff;--bg2:#f5f4f0;--bg3:#eceae4;--border:#e0ddd6;--border2:#ccc9c0;--text:#1a1a1a;--text2:#6b6860;--text3:#9b9890;--blue:#1a6bb5;--blue-bg:#e8f0fa;--green:#2d7d4f;--green-bg:#e8f5ee;--amber:#8a5c0a;--amber-bg:#fdf3e0;--red:#b53a3a;--red-bg:#fce8e8;--purple:#4a3a9e;--purple-bg:#eeedfb;--r:8px;--rl:12px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.logo h1{font-size:15px;font-weight:600;letter-spacing:0.03em}
.logo p{font-size:11px;color:var(--text3);margin-top:2px}
.nav{padding:10px 8px;flex:1;overflow-y:auto}
.nl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;padding:10px 8px 4px}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--text2);transition:all 0.1s}
.ni:hover{background:var(--bg2);color:var(--text)}
.ni.active{background:var(--bg2);color:var(--text);font-weight:500}
.ni svg{flex-shrink:0;opacity:0.7}
.ni.active svg{opacity:1}
.rbadge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;min-width:18px;text-align:center}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg2)}
.topbar{padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600;flex:1}
.content{flex:1;overflow-y:auto;padding:20px}
input,select,textarea{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);outline:none;width:100%;transition:border 0.15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.btn{font-family:inherit;font-size:12px;font-weight:500;padding:7px 14px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);cursor:pointer;white-space:nowrap;transition:all 0.1s}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-primary:hover{opacity:0.85}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-red{color:var(--red)}
.si{max-width:180px;font-size:12px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:500}
.stat-val{font-size:26px;font-weight:600;line-height:1}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.st{font-size:13px;font-weight:600}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th{text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border)}
.table td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.table tbody tr:hover td{background:var(--bg2)}
.table tbody tr:last-child td{border-bottom:none}
.bf{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px}
.f-gara{background:var(--amber-bg);color:var(--amber)}
.f-cantiere{background:var(--green-bg);color:var(--green)}
.f-aggiudicato{background:var(--blue-bg);color:var(--blue)}
.f-progettazione{background:var(--purple-bg);color:var(--purple)}
.f-completato{background:var(--bg3);color:var(--text2)}
.f-studio{background:#fbeaf0;color:#72243e}
.pn{font-weight:500}
.ps{font-size:11px;color:var(--text3);margin-top:2px}
.nl-list{display:flex;flex-direction:column;gap:8px}
.ni-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:12px 14px}
.ni-meta{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.ni-src{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em}
.ni-date{font-size:10px;color:var(--text3)}
.ni-tag{font-size:10px;padding:1px 7px;border-radius:99px;background:var(--bg2);border:1px solid var(--border);color:var(--text2)}
.ni-title{font-size:13px;font-weight:500;margin-bottom:3px}
.ni-proj{font-size:11px;color:var(--text3)}
.ni-exc{font-size:12px;color:var(--text2);line-height:1.55;margin-top:5px}
.rl{display:flex;flex-direction:column;gap:8px}
.ri{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rl)}
.rd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.d-red{background:var(--red)}
.d-amber{background:#e09010}
.d-green{background:var(--green)}
.rb{flex:1}
.rt{font-size:13px;font-weight:500}
.rp{font-size:11px;color:var(--text3);margin-top:2px}
.rdue{font-size:11px;color:var(--text3);white-space:nowrap}
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--bg);border-radius:var(--rl);border:1px solid var(--border);padding:22px;width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
.modal-title{font-size:15px;font-weight:600;margin-bottom:18px}
.fg{margin-bottom:12px}
.fl{display:block;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.factions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.df{background:var(--bg2);padding:10px 12px;border-radius:var(--r)}
.dfl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px}
.dfv{font-size:13px;font-weight:500}
.nb{background:var(--bg2);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:16px}
.lb{background:none;border:none;color:var(--blue);cursor:pointer;font-size:12px;font-family:inherit;padding:0;text-decoration:underline}
.empty{font-size:13px;color:var(--text3);padding:16px 0;text-align:center}
.tag-aggiudicazione{background:var(--blue-bg);color:var(--blue)}
.tag-gara{background:var(--amber-bg);color:var(--amber)}
.tag-cantiere{background:var(--green-bg);color:var(--green)}
.tag-milestone{background:var(--purple-bg);color:var(--purple)}
.tag-incidente{background:var(--red-bg);color:var(--red)}
.loading{display:flex;gap:5px;align-items:center;padding:24px 0}
.ld{width:7px;height:7px;border-radius:50%;background:var(--text3);animation:ld 1.2s ease-in-out infinite}
.ld:nth-child(2){animation-delay:.2s}.ld:nth-child(3){animation-delay:.4s}
@keyframes ld{0%,80%,100%{opacity:.3;transform:scale(.9)}40%{opacity:1;transform:scale(1.1)}}
.section-sep{border:none;border-top:1px solid var(--border);margin:16px 0}
.log-item{background:var(--bg2);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.log-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.log-date{font-size:11px;font-weight:600;color:var(--text)}
.log-tipo{font-size:10px;padding:1px 7px;border-radius:99px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.log-by{font-size:11px;color:var(--blue);font-weight:500;margin-left:auto}
.log-obj{font-size:13px;font-weight:500;margin-bottom:3px}
.log-esito{font-size:12px;color:var(--text2)}
.log-next{font-size:11px;color:var(--amber);margin-top:3px;font-style:italic}
.contact-card{background:var(--bg2);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.contact-name{font-size:13px;font-weight:500}
.contact-role{font-size:11px;color:var(--text3);margin-bottom:4px}
.contact-info{display:flex;gap:12px;flex-wrap:wrap}
.contact-info a{font-size:12px;color:var(--blue);text-decoration:none}
.contact-info span{font-size:12px;color:var(--text2)}
.tipo-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--blue-bg);color:var(--blue);margin-left:8px}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="logo"><h1>TunnelCRM</h1><p>Global project tracker</p></div>
    <div class="nav">
      <div class="nl">Panoramica</div>
      <div class="ni active" id="nav-dashboard" onclick="go('dashboard')">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Dashboard
      </div>
      <div class="nl">Progetti</div>
      <div class="ni" id="nav-projects" onclick="go('projects')">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
        Progetti
      </div>
      <div class="ni" id="nav-gare" onclick="go('gare')">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M7.8 4H4v16h16V4h-3.8M9 4h6a1 1 0 010 2H9a1 1 0 010-2z"/></svg>
        Gare & Contratti
      </div>
      <div class="ni" id="nav-news" onclick="go('news')">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zM3 9h18"/></svg>
        News & Log
      </div>
      <div class="ni" id="nav-reminders" onclick="go('reminders')">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        Reminder
        <span class="rbadge" id="rem-badge" style="display:none">0</span>
      </div>
      <div class="nl">Aziende</div>
      <div class="ni" id="nav-gc" onclick="go('gc')">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 21h18M3 7l9-4 9 4M4 7v14M20 7v14M8 11v4M12 11v4M16 11v4"/></svg>
        General Contractor
      </div>
      <div class="ni" id="nav-studi" onclick="go('studi')">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 14l9-5-9-5-9 5 9 5z"/><path d="M12 14l6.16-3.422A12.08 12.08 0 0112 21a12.08 12.08 0 01-6.16-10.422L12 14z"/></svg>
        Studi di Progettazione
      </div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <div id="topbar-actions" style="display:flex;gap:8px;align-items:center"></div>
    </div>
    <div class="content" id="content">
      <div class="loading"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
    </div>
  </div>
</div>
<script>
const SURL='https://jpbysnogsbkpimpxrpgl.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwYnlzbm9nc2JrcGltcHhycGdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNTI5NDIsImV4cCI6MjA5MzgyODk0Mn0.wQfi8ksOI5hBAZW0GNLMJRp-jlqZTwsCTSvqC_qqVMQ';
const sb=supabase.createClient(SURL,SKEY);
let view='dashboard',detailId=null,detailType=null;
let projects=[],gare=[],news=[],reminders=[],gcs=[],studi=[];

async function loadAll(){
  const [p,g,n,r,gc,st]=await Promise.all([
    sb.from('projects').select('*').order('created_at',{ascending:false}),
    sb.from('gare').select('*').order('created_at',{ascending:false}),
    sb.from('news').select('*').order('date',{ascending:false}),
    sb.from('reminders').select('*').order('due',{ascending:true}),
    sb.from('gc').select('*').order('name'),
    sb.from('studi').select('*').order('name')
  ]);
  projects=p.data||[];gare=g.data||[];news=n.data||[];reminders=r.data||[];gcs=gc.data||[];studi=st.data||[];
  updateBadge();
}

function updateBadge(){
  const open=reminders.filter(r=>r.status==='open').length;
  const b=document.getElementById('rem-badge');
  b.textContent=open;b.style.display=open>0?'':'none';
}

function pname(id){if(!id)return '—';const p=projects.find(x=>x.id==id);return p?p.name:'—';}
function fcls(f){const m={gara:'f-gara',cantiere:'f-cantiere',aggiudicato:'f-aggiudicato',progettazione:'f-progettazione',completato:'f-completato',studio:'f-studio'};return m[f]||'f-studio';}
function fbadge(f){return '<span class="bf '+fcls(f)+'">'+(f||'')+'</span>';}
function tagB(t){return '<span class="ni-tag tag-'+t+'">'+t+'</span>';}
function today(){return new Date().toISOString().slice(0,10);}
function v(id){const el=document.getElementById(id);return el?el.value:'';}

function remDot(due){
  if(!due)return 'd-green';
  const diff=(new Date(due)-new Date(today()))/(1000*60*60*24);
  if(diff<0||due===today())return 'd-red';
  if(diff<=7)return 'd-amber';
  return 'd-green';
}

function dlStyle(d){
  if(!d)return '';
  const diff=(new Date(d)-new Date(today()))/(1000*60*60*24);
  if(d===today())return 'background:#d4edda;color:#155724;font-weight:600;border-radius:4px;padding:4px 8px';
  if(diff>0&&diff<=7)return 'background:#fff3cd;color:#856404;font-weight:600;border-radius:4px;padding:4px 8px';
  if(diff<0)return 'background:#f8d7da;color:#721c24;font-weight:600;border-radius:4px;padding:4px 8px';
  return '';
}

function go(v2,id,type){
  view=v2;detailId=id||null;detailType=type||null;
  document.querySelectorAll('.ni').forEach(el=>el.classList.remove('active'));
  const nav=document.getElementById('nav-'+v2);
  if(nav)nav.classList.add('active');
  render();
}

async function render(){
  await loadAll();
  const c=document.getElementById('content');
  const ta=document.getElementById('topbar-actions');
  ta.innerHTML='';
  if(detailId&&detailType){renderDetail(c,ta);return;}
  const titles={dashboard:'Dashboard',projects:'Progetti',gare:'Gare & Contratti',news:'News & Log',reminders:'Reminder',gc:'General Contractor',studi:'Studi di Progettazione'};
  document.getElementById('topbar-title').textContent=titles[view]||'';
  if(view==='dashboard')renderDashboard(c,ta);
  else if(view==='projects')renderProjects(c,ta);
  else if(view==='gare')renderGare(c,ta);
  else if(view==='news')renderNews(c,ta);
  else if(view==='reminders')renderReminders(c,ta);
  else if(view==='gc')renderGC(c,ta);
  else if(view==='studi')renderStudi(c,ta);
}

function renderDashboard(c,ta){
  const openRem=reminders.filter(r=>r.status==='open');
  c.innerHTML='<div class="stats-row">'
    +'<div class="stat"><div class="stat-label">Progetti</div><div class="stat-val">'+projects.length+'</div><div class="stat-sub">nel mondo</div></div>'
    +'<div class="stat"><div class="stat-label">In cantiere</div><div class="stat-val">'+projects.filter(p=>p.phase==='cantiere').length+'</div><div class="stat-sub">attivi</div></div>'
    +'<div class="stat"><div class="stat-label">GC tracciati</div><div class="stat-val">'+gcs.length+'</div><div class="stat-sub">general contractor</div></div>'
    +'<div class="stat"><div class="stat-label">Studi</div><div class="stat-val">'+studi.length+'</div><div class="stat-sub">di progettazione</div></div>'
    +'</div>'
    +'<div class="sh"><span class="st">Ultimi aggiornamenti</span><button class="btn btn-sm" onclick="go(\'news\')">Vedi tutti →</button></div>'
    +'<div class="nl-list" style="margin-bottom:20px">'
    +(news.slice(0,4).map(n=>'<div class="ni-card"><div class="ni-meta"><span class="ni-src">'+(n.source||'')+'</span><span class="ni-date">'+(n.date||'')+'</span>'+tagB(n.tag||'')+'</div><div class="ni-title">'+n.title+'</div><div class="ni-proj">'+pname(n.project_id)+'</div></div>').join('')||'<div class="empty">Nessun aggiornamento.</div>')
    +'</div>'
    +'<div class="sh"><span class="st">Reminder in scadenza</span><button class="btn btn-sm" onclick="go(\'reminders\')">Vedi tutti →</button></div>'
    +'<div class="rl">'
    +(openRem.slice(0,3).map(r=>'<div class="ri"><div class="rd '+remDot(r.due)+'"></div><div class="rb"><div class="rt">'+r.text+'</div><div class="rp">'+pname(r.project_id)+'</div></div><div class="rdue">Scad. '+(r.due||'—')+'</div><button class="btn btn-sm" onclick="openEditReminder('+r.id+')">Modifica</button><button class="btn btn-sm btn-red" onclick="deleteReminder('+r.id+')">Elimina</button></div>').join('')||'<div class="empty">Nessun reminder aperto.</div>')
    +'</div>';
}

function renderProjects(c,ta){
  ta.innerHTML='<input class="si" placeholder="Cerca..." oninput="filterP(this.value)" id="psearch" style="width:150px"><button class="btn" onclick="printProjects()">Report HTML</button><button class="btn btn-primary" onclick="openProject()">+ Nuovo progetto</button>';
  c.innerHTML='<div class="card"><table class="table"><thead><tr><th>Progetto</th><th>Paese</th><th>Tipo</th><th>Km</th><th>Fase</th><th>GC</th><th>Valore</th><th></th></tr></thead><tbody id="ptbody">'+pRows(projects)+'</tbody></table></div>';
}
function pRows(list){
  if(!list.length)return '<tr><td colspan="8" class="empty">Nessun progetto.</td></tr>';
  return list.map(p=>'<tr><td><div class="pn">'+p.name+'</div><div class="ps">'+(p.client||'')+'</div></td><td style="color:var(--text2)">'+(p.country||'')+'</td><td>'+(p.type||'')+'</td><td>'+(p.km||'')+'</td><td>'+fbadge(p.phase)+'</td><td style="color:var(--text2);font-size:11px">'+(p.gc||'—')+'</td><td>'+(p.value||'')+'</td><td><button class="btn btn-sm" onclick="go(\'projects\','+p.id+',\'project\')">Apri →</button></td></tr>').join('');
}
function filterP(q){
  const f=projects.filter(p=>[p.name,p.country,p.gc,p.client,p.type].some(x=>(x||'').toLowerCase().includes(q.toLowerCase())));
  document.getElementById('ptbody').innerHTML=pRows(f);
}

function renderGare(c,ta){
  ta.innerHTML='<button class="btn" onclick="printGare()">Report HTML</button><button class="btn btn-primary" onclick="openGara()">+ Nuova gara</button>';
  c.innerHTML='<div class="card"><table class="table"><thead><tr><th>Progetto</th><th>Tipo tunnel</th><th>Rif. bando</th><th>Base d\'asta</th><th>Scadenza</th><th>Aggiudicatario</th><th>Ribasso</th><th>Data aggiud.</th><th>Fonte</th><th></th></tr></thead><tbody>'

function filterGC(q){
  const f=gcs.filter(g=>[g.name,g.country,g.specializzazioni,g.mercati].some(x=>(x||'').toLowerCase().includes(q.toLowerCase())));

function contactFixed(label,nome,cognome,email,tel){
  if(!nome&&!cognome&&!email&&!tel)return '<div class="contact-card" style="opacity:0.4"><div class="contact-role">'+label+'</div><div style="font-size:12px;color:var(--text3)">Non inserito</div></div>';
  return '<div class="contact-card"><div class="contact-role">'+label+'</div><div class="contact-name">'+((nome||'')+' '+(cognome||'')).trim()+'</div><div class="contact-info">'+(email?'<a href="mailto:'+email+'">'+email+'</a>':'')+(tel?'<span>'+tel+'</span>':'')+'</div></div>';
}

function contactCard(ct,showDelete){
  return '<div class="contact-card"><div class="contact-name">'+((ct.nome||'')+' '+(ct.cognome||'')).trim()+'</div><div class="contact-role">'+(ct.ruolo||'')+(ct.come_trovato?' · trovato via '+ct.come_trovato:'')+'</div><div class="contact-info">'+(ct.email?'<a href="mailto:'+ct.email+'">'+ct.email+'</a>':'')+(ct.tel?'<span>'+ct.tel+'</span>':'')+'</div>'+(ct.note?'<div style="font-size:11px;color:var(--text2);margin-top:4px">'+ct.note+'</div>':'')+'</div>';
}

function logCard(l){
  return '<div class="log-item"><div class="log-header"><span class="log-date">'+l.data+'</span><span class="log-tipo">'+(l.tipo||'')+'</span><span class="log-by">'+(l.inserito_da||'')+'</span></div><div class="log-obj">'+(l.oggetto||'')+'</div>'+(l.esito?'<div class="log-esito">'+l.esito+'</div>':'')+(l.prossimo_passo?'<div class="log-next">→ '+l.prossimo_passo+'</div>':'')+'</div>';
}

function modal(html){
  const ov=document.createElement('div');ov.className='mo';ov.id='mov';
  ov.innerHTML='<div class="modal">'+html+'</div>';
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  document.body.appendChild(ov);
}
function closeModal(){const m=document.getElementById('mov');if(m)m.remove();}

function projectOptions(selId){return projects.map(p=>'<option value="'+p.id+'"'+(p.id==selId?' selected':'')+'>'+p.name+'</option>').join('');}
